# Balanceador de carga de SIGERIC.
# Reparte las peticiones entre app1 y app2 (round-robin). Si una instancia no responde,
# NGINX reintenta la MISMA petición en la otra instancia (el usuario no ve el error)
# y la saca de la rotación durante 10 s antes de volver a probarla.
# Si llega detrás de otro proxy con HTTPS (p. ej. un túnel de Cloudflare), se respeta su
# X-Forwarded-Proto para que las redirecciones (login) usen https. Si no, se usa el esquema real.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream sigeric_app {
    server 172.28.50.21:8080 max_fails=1 fail_timeout=10s;   # app1
    server 172.28.50.22:8080 max_fails=1 fail_timeout=10s;   # app2
    # Las mismas instancias como respaldo, sin marcarse nunca como caídas: si NGINX llegara a
    # considerar caídas a ambas (p. ej. una apagada y la otra con un tropiezo momentáneo),
    # vuelve a intentarlo con ellas en lugar de responder 502 de inmediato.
    server 172.28.50.21:8080 backup max_fails=0;
    server 172.28.50.22:8080 backup max_fails=0;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    location / {
        proxy_pass http://sigeric_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Failover transparente: ante error de conexión, timeout o 502/503/504 se pasa a la otra instancia.
        # non_idempotent: también se reintentan los POST (formularios) si la instancia murió de golpe
        # mientras los procesaba; así el usuario nunca ve un error por la caída de una instancia.
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 4;
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;

        # Para la demostración: qué instancia atendió la petición
        add_header X-Atendido-Por $upstream_addr always;
    }

    # Estado del propio balanceador
    location = /nginx-salud {
        access_log off;
        return 200 "nginx ok\n";
    }
}
